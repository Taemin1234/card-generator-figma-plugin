<style>
  :root {
    color: #1f2328;
    font-family: Inter, Arial, sans-serif;
    font-size: 13px;
  }

  body {
    margin: 0;
  }

  .app {
    padding: 16px;
  }

  h3 {
    font-size: 15px;
    margin: 0 0 14px;
  }

  label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .mode-tabs {
    background: #f6f8fa;
    border: 1px solid #d0d7de;
    border-radius: 8px;
    display: grid;
    gap: 4px;
    grid-template-columns: 1fr 1fr;
    margin-bottom: 14px;
    padding: 4px;
  }

  .mode-tab {
    background: transparent;
    color: #57606a;
    height: 30px;
  }

  .mode-tab.active {
    background: #1f2328;
    color: #fff;
  }

  .search-row {
    display: flex;
    gap: 8px;
  }

  input,
  button {
    border-radius: 6px;
    box-sizing: border-box;
    font: inherit;
    height: 34px;
  }

  input {
    border: 1px solid #d0d7de;
    flex: 1;
    min-width: 0;
    padding: 0 10px;
  }

  button {
    background: #1f2328;
    border: 0;
    color: #fff;
    cursor: pointer;
    font-weight: 600;
    padding: 0 12px;
  }

  button:disabled {
    background: #8c959f;
    cursor: default;
  }

  .section {
    margin-top: 16px;
  }

  .results,
  .selected {
    border: 1px solid #d0d7de;
    border-radius: 8px;
    max-height: 172px;
    min-height: 68px;
    overflow: auto;
  }

  .selected {
    max-height: 160px;
  }

  .empty {
    color: #6e7781;
    padding: 14px;
  }

  .item {
    align-items: center;
    border-bottom: 1px solid #eaeef2;
    display: grid;
    gap: 10px;
    grid-template-columns: 44px 1fr auto;
    padding: 8px;
  }

  .item:last-child {
    border-bottom: 0;
  }

  .cover {
    background: #f6f8fa;
    border-radius: 6px;
    height: 44px;
    object-fit: cover;
    width: 44px;
  }

  .title-row {
    align-items: center;
    display: flex;
    gap: 6px;
    min-width: 0;
  }

  .title {
    font-weight: 700;
    line-height: 1.25;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .badge {
    background: #eaeef2;
    border-radius: 999px;
    color: #57606a;
    flex: 0 0 auto;
    font-size: 11px;
    padding: 2px 6px;
  }

  .meta {
    color: #57606a;
    font-size: 12px;
    line-height: 1.35;
    margin-top: 2px;
  }

  .ghost {
    background: #f6f8fa;
    color: #1f2328;
  }

  .danger {
    background: #fff;
    border: 1px solid #d0d7de;
    color: #cf222e;
  }

  .generate {
    margin-top: 16px;
    width: 100%;
  }

  #status {
    color: #57606a;
    font-size: 12px;
    min-height: 18px;
  }
</style>

<div class="app">
  <h3>DPC 카드 생성기</h3>

  <div class="mode-tabs" role="tablist" aria-label="검색 유형">
    <button class="mode-tab active" data-mode="track" type="button">곡</button>
    <button class="mode-tab" data-mode="album" type="button">앨범</button>
  </div>

  <label for="search">제목 또는 가수 검색</label>
  <div class="search-row">
    <input id="search" placeholder="예: APT. 또는 aespa" />
    <button id="searchButton" type="button">검색</button>
  </div>

  <div class="section">
    <label id="resultsLabel">검색 결과</label>
    <div id="results" class="results">
      <div class="empty">검색어를 입력하면 곡 목록이 표시됩니다.</div>
    </div>
  </div>

  <div class="section">
    <label>추가된 항목</label>
    <div id="selected" class="selected">
      <div class="empty">아직 추가된 곡이나 앨범이 없습니다.</div>
    </div>
  </div>

  <input id="country" value="KR" type="hidden" />

  <button id="generate" class="generate" disabled type="button">카드 생성</button>
  <p id="status"></p>
</div>

<script>
  const searchInput = document.getElementById('search');
  const searchButton = document.getElementById('searchButton');
  const resultsEl = document.getElementById('results');
  const selectedEl = document.getElementById('selected');
  const generateButton = document.getElementById('generate');
  const statusEl = document.getElementById('status');
  const resultsLabel = document.getElementById('resultsLabel');
  const modeTabs = Array.from(document.querySelectorAll('.mode-tab'));
  const selectedItems = [];
  let currentMode = 'track';

  // iTunes의 100px 커버 URL을 카드용 고해상도 URL로 변환한다.
  function getHighResArtwork(url) {
    return url ? url.replace('100x100bb.jpg', '600x600bb.jpg') : '';
  }

  // iTunes 날짜를 카드에 바로 넣기 쉬운 YYYY-MM-DD 문자열로 정리한다.
  function formatDate(value) {
    if (!value) return '';
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? value : date.toISOString().slice(0, 10);
  }

  // 곡 검색 결과를 플러그인 본문이 이해하는 공통 카드 데이터로 바꾼다.
  function trackToCardData(item) {
    return {
      id: `track-${item.trackId || `${item.trackName}-${item.artistName}`}`,
      kind: 'track',
      title: item.trackName || '',
      artist: item.artistName || '',
      album: item.collectionName || '',
      coverUrl: getHighResArtwork(item.artworkUrl100),
      releaseDate: formatDate(item.releaseDate),
      genre: item.primaryGenreName || '',
      link: item.trackViewUrl || ''
    };
  }

  // 앨범 검색 결과도 같은 카드 데이터 구조로 맞춰 카드 생성 로직을 공유한다.
  function albumToCardData(item) {
    return {
      id: `album-${item.collectionId || `${item.collectionName}-${item.artistName}`}`,
      kind: 'album',
      title: item.collectionName || '',
      artist: item.artistName || '',
      album: item.collectionName || '',
      coverUrl: getHighResArtwork(item.artworkUrl100),
      releaseDate: formatDate(item.releaseDate),
      genre: item.primaryGenreName || '',
      link: item.collectionViewUrl || ''
    };
  }

  // 빈 결과, 로딩, 오류 메시지를 목록 영역에 같은 모양으로 표시한다.
  function renderEmpty(target, message) {
    target.innerHTML = '';
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = message;
    target.appendChild(empty);
  }

  // 검색 결과와 추가된 항목 목록에서 공통으로 쓰는 한 줄 UI를 만든다.
  function createItemRow(item, actionLabel, onAction, actionClass) {
    const row = document.createElement('div');
    row.className = 'item';

    const cover = document.createElement('img');
    cover.className = 'cover';
    cover.alt = '';
    cover.src = item.coverUrl || '';

    const info = document.createElement('div');
    const titleRow = document.createElement('div');
    titleRow.className = 'title-row';

    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = item.title || 'Untitled';

    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = item.kind === 'album' ? '앨범' : '곡';

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = [item.artist, item.album, item.releaseDate].filter(Boolean).join(' · ');

    titleRow.appendChild(title);
    titleRow.appendChild(badge);
    info.appendChild(titleRow);
    info.appendChild(meta);

    const action = document.createElement('button');
    action.className = actionClass || 'ghost';
    action.textContent = actionLabel;
    action.type = 'button';
    action.onclick = onAction;

    row.appendChild(cover);
    row.appendChild(info);
    row.appendChild(action);

    return row;
  }

  // 현재 검색 모드에 맞게 검색 결과 목록을 렌더링한다.
  function renderResults(items) {
    resultsEl.innerHTML = '';

    if (!items.length) {
      renderEmpty(resultsEl, '검색 결과가 없습니다.');
      return;
    }

    items.forEach((item) => {
      const alreadyAdded = selectedItems.some((selected) => selected.id === item.id);
      const row = createItemRow(
        item,
        alreadyAdded ? '추가됨' : '추가',
        () => addItem(item),
        alreadyAdded ? 'ghost' : undefined
      );

      row.querySelector('button').disabled = alreadyAdded;
      resultsEl.appendChild(row);
    });
  }

  // 사용자가 카드로 만들 항목 목록을 다시 그린다.
  function renderSelected() {
    selectedEl.innerHTML = '';
    generateButton.disabled = selectedItems.length === 0;

    if (!selectedItems.length) {
      renderEmpty(selectedEl, '아직 추가된 곡이나 앨범이 없습니다.');
      return;
    }

    selectedItems.forEach((item, index) => {
      selectedEl.appendChild(
        createItemRow(item, '삭제', () => removeItem(index), 'danger')
      );
    });
  }

  // 검색 모드를 바꾸면 검색창과 결과 안내 문구를 새 모드에 맞게 갱신한다.
  function setMode(mode) {
    currentMode = mode;
    modeTabs.forEach((tab) => {
      tab.classList.toggle('active', tab.dataset.mode === mode);
    });

    searchInput.placeholder = mode === 'album'
      ? '예: NewJeans 또는 The Winning'
      : '예: APT. 또는 aespa';
    resultsLabel.textContent = mode === 'album' ? '앨범 검색 결과' : '곡 검색 결과';
    renderEmpty(resultsEl, `검색어를 입력하면 ${mode === 'album' ? '앨범' : '곡'} 목록이 표시됩니다.`);
  }

  function addItem(item) {
    if (selectedItems.some((selected) => selected.id === item.id)) return;
    selectedItems.push(item);
    renderSelected();
    statusEl.textContent = `${item.title} 추가됨`;
  }

  function removeItem(index) {
    selectedItems.splice(index, 1);
    renderSelected();
  }

  // iTunes Search API를 호출하고 모드에 따라 곡 또는 앨범 결과로 파싱한다.
  async function searchItems() {
    const term = searchInput.value.trim();
    const country = document.getElementById('country').value.trim().toUpperCase() || 'KR';

    if (!term) {
      renderEmpty(resultsEl, '검색어를 입력하세요.');
      return;
    }

    searchButton.disabled = true;
    statusEl.textContent = '검색 중...';
    renderEmpty(resultsEl, '검색 중...');

    try {
      const params = new URLSearchParams({
        term,
        country,
        media: 'music',
        entity: currentMode === 'album' ? 'album' : 'song',
        limit: '10'
      });

      const response = await fetch(`https://itunes.apple.com/search?${params.toString()}`);

      if (!response.ok) {
        throw new Error('iTunes 검색에 실패했습니다.');
      }

      const data = await response.json();
      const mapper = currentMode === 'album' ? albumToCardData : trackToCardData;
      renderResults((data.results || []).map(mapper));
      statusEl.textContent = '';
    } catch (error) {
      renderEmpty(resultsEl, '검색 중 오류가 발생했습니다.');
      statusEl.textContent = error.message || '오류가 발생했습니다.';
    } finally {
      searchButton.disabled = false;
    }
  }

  modeTabs.forEach((tab) => {
    tab.onclick = () => setMode(tab.dataset.mode);
  });

  searchButton.onclick = searchItems;
  searchInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      searchItems();
    }
  });

  // 추가된 곡/앨범 카드 데이터를 Figma 플러그인 본문으로 전달한다.
  generateButton.onclick = () => {
    const country = document.getElementById('country').value.trim().toUpperCase() || 'KR';

    parent.postMessage(
      {
        pluginMessage: {
          type: 'generate-cards',
          tracks: selectedItems,
          country
        }
      },
      '*'
    );

    statusEl.textContent = '생성 중...';
  };
</script>
